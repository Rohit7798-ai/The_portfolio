<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="tealGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="bubbleUser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Subtle neural grid lines -->
  <g stroke="#14b8a6" stroke-opacity="0.15" stroke-width="1">
    <line x1="100" y1="80" x2="250" y2="140" />
    <line x1="250" y1="140" x2="380" y2="90" />
    <line x1="380" y1="90" x2="520" y2="150" />
    <line x1="520" y1="150" x2="680" y2="100" />
    <line x1="250" y1="140" x2="220" y2="280" />
    <line x1="520" y1="150" x2="560" y2="300" />
  </g>
  <g fill="#10b981" fill-opacity="0.3">
    <circle cx="100" cy="80" r="4"/>
    <circle cx="250" cy="140" r="5"/>
    <circle cx="380" cy="90" r="4"/>
    <circle cx="520" cy="150" r="6"/>
    <circle cx="680" cy="100" r="4"/>
  </g>

  <!-- Main Application Window Mockup -->
  <g transform="translate(60, 40)" filter="url(#shadow)">
    <!-- Window frame -->
    <rect width="680" height="370" rx="16" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
    
    <!-- Window Header / Topbar -->
    <path d="M 0 16 Q 0 0 16 0 L 664 0 Q 680 0 680 16 L 680 50 L 0 50 Z" fill="#0f172a" fill-opacity="0.8"/>
    <line x1="0" y1="50" x2="680" y2="50" stroke="#334155" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="24" cy="25" r="6" fill="#ef4444"/>
    <circle cx="44" cy="25" r="6" fill="#f59e0b"/>
    <circle cx="64" cy="25" r="6" fill="#10b981"/>
    
    <!-- App Title with Medical Cross Badge -->
    <g transform="translate(95, 14)">
      <rect width="24" height="22" rx="5" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
      <!-- Cross -->
      <path d="M 12 5 L 12 17 M 6 11 L 18 11" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
      <text x="34" y="16" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">
        MediBot <tspan fill="#34d399" font-weight="500">| Medical RAG Assistant</tspan>
      </text>
    </g>

    <!-- Top Status Badges -->
    <g transform="translate(430, 16)">
      <rect width="110" height="20" rx="10" fill="#065f46" fill-opacity="0.6" stroke="#10b981" stroke-width="1"/>
      <circle cx="12" cy="10" r="3" fill="#34d399"/>
      <text x="22" y="14" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Llama 3.1 8B</text>
      
      <rect x="120" width="115" height="20" rx="10" fill="#1e3a8a" fill-opacity="0.6" stroke="#3b82f6" stroke-width="1"/>
      <text x="130" y="14" fill="#bfdbfe" font-family="system-ui, sans-serif" font-size="9" font-weight="600">FAISS Index: Active</text>
    </g>

    <!-- Sidebar / Ingestion Info -->
    <rect x="0" y="50" width="190" height="320" fill="#090d16" fill-opacity="0.6"/>
    <line x1="190" y1="50" x2="190" y2="370" stroke="#1e293b" stroke-width="1"/>
    
    <text x="18" y="78" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">KNOWLEDGE BASE</text>
    <rect x="15" y="90" width="160" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="25" y="110" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Gale Encyclopedia</text>
    <text x="25" y="128" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Chunks: 500c | Overlap: 50c</text>

    <text x="18" y="168" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">PIPELINE METRICS</text>
    <g transform="translate(15, 180)">
      <rect width="160" height="36" rx="6" fill="#132320" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
      <text x="10" y="22" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Embedding: MiniLM-L6-v2</text>
    </g>
    <g transform="translate(15, 224)">
      <rect width="160" height="36" rx="6" fill="#132320" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
      <text x="10" y="22" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Similarity Top-K: 3 Chunks</text>
    </g>
    <g transform="translate(15, 268)">
      <rect width="160" height="36" rx="6" fill="#132320" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
      <text x="10" y="22" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10" font-weight="600">LangChain Framework</text>
    </g>

    <!-- Main Chat Feed -->
    <!-- User Question -->
    <g transform="translate(340, 75)">
      <rect width="310" height="42" rx="12" fill="url(#bubbleUser)"/>
      <text x="14" y="26" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="500">
        What are the clinical indicators of Type 2 Diabetes?
      </text>
    </g>

    <!-- Assistant Response with Citation -->
    <g transform="translate(210, 130)">
      <rect width="440" height="150" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      
      <circle cx="25" cy="25" r="12" fill="#047857"/>
      <text x="21" y="29" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">AI</text>
      
      <text x="46" y="24" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">MediBot</text>
      <text x="102" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Context Grounded • Llama 3.1</text>

      <text x="20" y="52" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="400">
        Based on The Gale Encyclopedia of Medicine, key indicators include:
      </text>
      <text x="20" y="70" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10.5">
        • Polyuria (frequent urination) and polydipsia (excessive thirst)
      </text>
      <text x="20" y="86" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10.5">
        • Unexplained weight loss, persistent fatigue, and blurred vision
      </text>
      <text x="20" y="102" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10.5">
        • Elevated fasting plasma glucose (≥126 mg/dL) verified by diagnostic panels.
      </text>

      <!-- Citation Badge -->
      <g transform="translate(20, 118)">
        <rect width="320" height="22" rx="5" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
        <text x="8" y="15" fill="#34d399" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">
          Source Citation: The Gale Encyclopedia of Medicine, 2nd Ed. (p. 1024)
        </text>
      </g>
    </g>

    <!-- Bottom Query Bar Mockup -->
    <g transform="translate(210, 305)">
      <rect width="440" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="16" y="26" fill="#64748b" font-family="system-ui, sans-serif" font-size="11.5">
        Ask a medical question based on encyclopedia literature...
      </text>
      <rect x="365" y="7" width="65" height="28" rx="6" fill="url(#tealGlow)"/>
      <text x="382" y="25" fill="#022c22" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Query</text>
    </g>
  </g>
</svg>
